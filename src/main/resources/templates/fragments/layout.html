<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="base(title, activePage)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">AppVendasBares</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/header :: header(${title})}"></div>

            <div class="content-wrapper">
                <div th:fragment="content">
                    <!-- Page content injected here -->
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
