<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Painel de Producao</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('cozinha')}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/header :: header('Painel de Producao')}"></div>

            <div class="content-wrapper">
                <div class="setor-tabs" id="setorTabs">
                    <button th:each="setor : ${setores}" class="setor-tab"
                            th:text="${setor}" th:data-setor="${setor}"
                            onclick="selectSetor(this)"></button>
                </div>

                <div class="stats">
                    <div class="stat-card fila"><div class="number" id="statFila">0</div><div class="label">Em Fila</div></div>
                    <div class="stat-card preparo"><div class="number" id="statPreparo">0</div><div class="label">Em Preparo</div></div>
                    <div class="stat-card pronto"><div class="number" id="statPronto">0</div><div class="label">Prontos</div></div>
                    <div class="stat-card atrasado"><div class="number" id="statAtrasado">0</div><div class="label">Atrasados</div></div>
                </div>

                <div id="filaContainer" class="fila-grid"></div>
                <div id="emptyMsg" class="empty-msg" style="display:none;">Nenhum pedido neste setor</div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        const empresaId = [[${empresaId}]];
        let currentSetor = null;
        let stompClient = null;

        document.addEventListener('DOMContentLoaded', function() {
            const firstTab = document.querySelector('.setor-tab');
            if (firstTab) { selectSetor(firstTab); }
            connectWebSocket();
        });

        function selectSetor(btn) {
            document.querySelectorAll('.setor-tab').forEach(function(t) { t.classList.remove('active'); });
            btn.classList.add('active');
            currentSetor = btn.dataset.setor;
            loadFila();
        }

        function loadFila() {
            fetch('/api/pedidos/fila/' + empresaId + '/' + currentSetor)
                .then(function(r) { return r.json(); })
                .then(function(itens) { renderFila(itens); })
                .catch(function() {});
        }

        function renderFila(itens) {
            var container = document.getElementById('filaContainer');
            var empty = document.getElementById('emptyMsg');

            if (!itens || itens.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                updateStats(itens || []);
                return;
            }
            empty.style.display = 'none';
            updateStats(itens);

            container.innerHTML = itens.map(function(item) {
                var statusClass = item.status === 'EM_PREPARO' ? 'em-preparo' : item.status === 'PRONTO' ? 'pronto' : '';
                var html = '<div class="pedido-card ' + statusClass + '">';
                html += '<div class="header"><span class="produto">' + item.produtoNome + '</span><span class="qty">' + item.quantidade + 'x</span></div>';
                html += '<div class="mesa">Status: ' + item.status.replace('_', ' ') + '</div>';
                if (item.observacao) { html += '<div class="obs">Obs: ' + item.observacao + '</div>'; }
                html += '<div class="actions">';
                if (item.status === 'RECEBIDO' || item.status === 'EM_FILA') {
                    html += '<button class="btn-preparo" onclick="updateStatus(' + item.id + ', \'EM_PREPARO\')">Iniciar Preparo</button>';
                }
                if (item.status === 'EM_PREPARO') {
                    html += '<button class="btn-pronto" onclick="updateStatus(' + item.id + ', \'PRONTO\')">Marcar Pronto</button>';
                }
                if (item.status === 'PRONTO') {
                    html += '<button class="btn-entregar" onclick="updateStatus(' + item.id + ', \'ENTREGUE\')">Entregar</button>';
                }
                html += '</div></div>';
                return html;
            }).join('');
        }

        function updateStats(itens) {
            document.getElementById('statFila').textContent = itens.filter(function(i) { return i.status === 'RECEBIDO' || i.status === 'EM_FILA'; }).length;
            document.getElementById('statPreparo').textContent = itens.filter(function(i) { return i.status === 'EM_PREPARO'; }).length;
            document.getElementById('statPronto').textContent = itens.filter(function(i) { return i.status === 'PRONTO'; }).length;
            document.getElementById('statAtrasado').textContent = 0;
        }

        function updateStatus(itemId, status) {
            fetch('/api/pedidos/item/' + itemId + '/status?status=' + status, { method: 'PUT' })
                .then(function(r) { return r.json(); })
                .then(function() { loadFila(); })
                .catch(function() { alert('Erro ao atualizar status'); });
        }

        function connectWebSocket() {
            var socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, function() {
                stompClient.subscribe('/topic/pedidos/' + empresaId, function() {
                    if (currentSetor) loadFila();
                });
            });
        }
    </script>
</body>
</html>
