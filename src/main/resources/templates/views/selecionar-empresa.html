<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Selecionar Estabelecimento</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div style="background: var(--bg-color); min-height: 100vh;">
        <div class="master-selection">
            <div style="margin-bottom: 30px;">
                <div style="width:60px;height:60px;background:var(--accent-color);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;">&#127970;</div>
                <h1>Selecionar Estabelecimento</h1>
                <p class="subtitle">Escolha o estabelecimento que deseja gerenciar</p>
            </div>

            <div class="empresa-grid">
                <div th:each="empresa : ${empresas}" class="empresa-card"
                     th:onclick="'selecionarEmpresa(' + ${empresa.id} + ')'">
                    <div class="empresa-icon">&#127860;</div>
                    <div class="empresa-nome" th:text="${empresa.nomeFantasia}">Bar do Demo</div>
                    <div class="empresa-cnpj" th:text="${empresa.cnpj}">00.000.000/0001-00</div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <button class="btn-logout" onclick="doLogout()" style="padding: 10px 24px; font-size: 14px;">
                    &#128682; Sair
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        function selecionarEmpresa(empresaId) {
            fetch('/api/auth/selecionar-empresa/' + empresaId, { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.erro) {
                        showToast(data.erro, true);
                    } else {
                        var usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
                        usuario.empresaId = empresaId;
                        localStorage.setItem('usuario', JSON.stringify(usuario));
                        window.location.href = '/admin/dashboard/' + empresaId;
                    }
                })
                .catch(function() { showToast('Erro de conexao', true); });
        }
    </script>
</body>
</html>
