<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Acompanhar Pedido</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('acompanhar')}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/header :: header('Acompanhar Pedido')}"></div>

            <div class="content-wrapper">
                <div class="acompanhar-container">
                    <div class="pedido-info-card">
                        <h2>Pedido #<span th:text="${pedido.id}">1</span></h2>
                        <p>Status: <span class="status-badge" th:classappend="'status-' + ${pedido.status}" th:text="${pedido.status}">RECEBIDO</span></p>
                        <p style="margin-top:8px; color:var(--text-muted);">Mesa: <span th:text="${pedido.mesaNumero}">1</span></p>
                    </div>

                    <div class="status-timeline">
                        <div class="status-step">
                            <div class="status-dot" th:classappend="${pedido.status == 'RECEBIDO'} ? 'current' : (${pedido.status != 'RECEBIDO'} ? 'active' : '')">&#10003;</div>
                            <div class="status-label">Recebido</div>
                        </div>
                        <div class="status-step">
                            <div class="status-dot" th:classappend="${pedido.status == 'EM_PREPARO'} ? 'current' : (${pedido.status == 'PRONTO' or pedido.status == 'ENTREGUE' or pedido.status == 'FECHADO'} ? 'active' : '')">&#127859;</div>
                            <div class="status-label">Em Preparo</div>
                        </div>
                        <div class="status-step">
                            <div class="status-dot" th:classappend="${pedido.status == 'PRONTO'} ? 'current' : (${pedido.status == 'ENTREGUE' or pedido.status == 'FECHADO'} ? 'active' : '')">&#10003;</div>
                            <div class="status-label">Pronto</div>
                        </div>
                        <div class="status-step">
                            <div class="status-dot" th:classappend="${pedido.status == 'ENTREGUE'} ? 'current' : (${pedido.status == 'FECHADO'} ? 'active' : '')">&#127860;</div>
                            <div class="status-label">Entregue</div>
                        </div>
                    </div>

                    <div class="itens-list">
                        <h3 style="margin-bottom:12px;">Itens do Pedido</h3>
                        <div th:each="item : ${pedido.itens}" class="item-row">
                            <div>
                                <div class="item-name"><span th:text="${item.quantidade}">1</span>x <span th:text="${item.produtoNome}">Produto</span></div>
                                <div class="item-obs" th:if="${item.observacao != null}" th:text="'Obs: ' + ${item.observacao}"></div>
                            </div>
                            <div style="text-align:right;">
                                <span class="item-status" th:classappend="${item.status}" th:text="${item.status}">RECEBIDO</span>
                                <div style="margin-top:4px; color:var(--green); font-weight:600;">R$ <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="total-bar">
                        <div style="color:var(--text-muted); font-size:14px;">Total do Pedido</div>
                        <div class="total">R$ <span th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}">0.00</span></div>
                    </div>

                    <a class="btn-voltar" th:href="'/comanda/' + ${pedido.mesaId}">Voltar para Comanda</a>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        var pedidoId = [[${pedidoId}]];
        var empresaId = [[${pedido.empresaId}]];

        var socket = new SockJS('/ws');
        var stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, function() {
            stompClient.subscribe('/topic/pedidos/' + empresaId, function() {
                location.reload();
            });
        });
    </script>
</body>
</html>
