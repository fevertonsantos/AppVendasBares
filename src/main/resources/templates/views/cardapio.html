<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cardapio Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('cardapio')}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/header :: header('Cardapio Digital')}"></div>

            <div class="content-wrapper" style="padding-bottom: 100px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="background: var(--accent-light); color: var(--accent-color); padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;">
                            Mesa <span th:text="${mesa.numero}">1</span> - <span th:text="${mesa.area}">Salao</span>
                        </span>
                    </div>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Buscar produto..." oninput="filterProducts()"/>
                </div>

                <div class="categorias">
                    <button class="cat-btn active" onclick="filterByCategory(null, this)">Todos</button>
                </div>

                <div th:if="${#lists.isEmpty(itensCardapio)}" class="vazio">
                    Nenhum produto disponivel no momento.
                </div>

                <div id="gridProdutos" class="product-grid">
                    <div class="product-card" th:each="produto : ${itensCardapio}"
                         th:data-nome="${produto.nome}" th:data-categoria="${produto.categoria}"
                         th:data-id="${produto.id}" th:data-preco="${produto.preco}">
                        <div class="card-body">
                            <h3 th:text="${produto.nome}">Produto</h3>
                            <p class="desc" th:text="${produto.descricao}">Descricao</p>
                            <span class="cat-tag" th:text="${produto.categoria}">Categoria</span>
                            <div class="preco">R$ <span th:text="${#numbers.formatDecimal(produto.preco, 1, 2)}">0.00</span></div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
                                <span class="qty-val">0</span>
                                <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
                            </div>
                            <input class="obs-input" type="text" placeholder="Observacoes (ex: sem cebola)"/>
                            <button class="btn-add" onclick="addToCart(this)">Adicionar ao Pedido</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Bar -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-bar-inner">
            <div>
                <span id="cartCount">0</span> itens | <span class="cart-total">R$ <span id="cartTotal">0.00</span></span>
            </div>
            <button class="btn-enviar" onclick="showConfirmModal()">Enviar Pedido</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h2>Confirmar Pedido</h2>
            <p>Mesa: <strong th:text="${mesa.numero}">1</strong> - <span th:text="${mesa.nome}">Mesa 1</span></p>
            <div id="cartSummary" style="margin: 16px 0; max-height: 200px; overflow-y: auto;"></div>
            <p style="font-size:18px; font-weight:700; color:var(--green); margin:10px 0;">Total: R$ <span id="modalTotal">0.00</span></p>
            <div class="form-group">
                <label>Senha para confirmar</label>
                <input type="password" id="confirmSenha" placeholder="Sua senha"/>
            </div>
            <div class="btn-row">
                <button class="btn-cancel" onclick="hideConfirmModal()">Cancelar</button>
                <button class="btn-confirm" onclick="enviarPedido()">Confirmar</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        var mesaId = [[${mesa.id}]];
        var empresaId = [[${mesa.empresa.id}]];
        var cart = [];

        // Extract unique categories and render category buttons
        var cards = document.querySelectorAll('.product-card');
        var cats = new Set();
        cards.forEach(function(c) { cats.add(c.dataset.categoria); });
        var catContainer = document.querySelector('.categorias');
        cats.forEach(function(cat) {
            var btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.textContent = cat;
            btn.onclick = function() { filterByCategory(cat, this); };
            catContainer.appendChild(btn);
        });

        function filterByCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            cards.forEach(function(card) {
                card.style.display = (!cat || card.dataset.categoria === cat) ? '' : 'none';
            });
        }

        function filterProducts() {
            var q = document.getElementById('searchInput').value.toLowerCase();
            cards.forEach(function(card) {
                var name = card.dataset.nome.toLowerCase();
                card.style.display = name.includes(q) ? '' : 'none';
            });
        }

        function changeQty(btn, delta) {
            var container = btn.closest('.qty-controls');
            var valEl = container.querySelector('.qty-val');
            var val = parseInt(valEl.textContent) + delta;
            if (val < 0) val = 0;
            valEl.textContent = val;
        }

        function addToCart(btn) {
            var card = btn.closest('.product-card');
            var qty = parseInt(card.querySelector('.qty-val').textContent);
            if (qty <= 0) return;

            var obs = card.querySelector('.obs-input').value;
            var item = {
                produtoId: parseInt(card.dataset.id),
                nome: card.dataset.nome,
                preco: parseFloat(card.dataset.preco),
                quantidade: qty,
                observacao: obs,
                adicionais: []
            };

            var existing = cart.find(function(c) { return c.produtoId === item.produtoId; });
            if (existing) {
                existing.quantidade += qty;
                existing.observacao = obs || existing.observacao;
            } else {
                cart.push(item);
            }

            card.querySelector('.qty-val').textContent = '0';
            card.querySelector('.obs-input').value = '';
            updateCartBar();
            showToast(qty + 'x ' + item.nome + ' adicionado ao pedido');
        }

        function updateCartBar() {
            var bar = document.getElementById('cartBar');
            var totalItems = cart.reduce(function(s, i) { return s + i.quantidade; }, 0);
            var totalPrice = cart.reduce(function(s, i) { return s + (i.preco * i.quantidade); }, 0);

            document.getElementById('cartCount').textContent = totalItems;
            document.getElementById('cartTotal').textContent = totalPrice.toFixed(2);
            bar.style.display = totalItems > 0 ? 'block' : 'none';
        }

        function showConfirmModal() {
            var summary = document.getElementById('cartSummary');
            summary.innerHTML = cart.map(function(i) {
                var html = '<div style="padding:4px 0;border-bottom:1px solid var(--border-color);">' + i.quantidade + 'x ' + i.nome + ' - R$ ' + (i.preco * i.quantidade).toFixed(2);
                if (i.observacao) { html += '<br><small style="color:var(--text-muted);">Obs: ' + i.observacao + '</small>'; }
                html += '</div>';
                return html;
            }).join('');
            document.getElementById('modalTotal').textContent = cart.reduce(function(s, i) { return s + (i.preco * i.quantidade); }, 0).toFixed(2);
            document.getElementById('confirmModal').classList.add('show');
        }

        function hideConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        function enviarPedido() {
            var senha = document.getElementById('confirmSenha').value;
            if (!senha) { alert('Informe sua senha para confirmar'); return; }

            var usuario = JSON.parse(localStorage.getItem('usuario') || '{}');

            var pedido = {
                empresaId: empresaId,
                mesaId: mesaId,
                usuarioId: usuario.id || null,
                garcomId: null,
                itens: cart.map(function(i) {
                    return {
                        produtoId: i.produtoId,
                        quantidade: i.quantidade,
                        observacao: i.observacao,
                        adicionais: i.adicionais
                    };
                })
            };

            fetch('/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pedido)
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.erro) {
                    alert('Erro: ' + data.erro);
                } else {
                    cart = [];
                    updateCartBar();
                    hideConfirmModal();
                    window.location.href = '/pedido/acompanhar/' + data.id;
                }
            })
            .catch(function() { alert('Erro de conexao'); });
        }
    </script>
</body>
</html>
