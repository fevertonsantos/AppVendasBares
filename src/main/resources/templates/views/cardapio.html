<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cardápio Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .topo {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .mesa-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .titulo {
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card-produto {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card-produto h3 {
            margin-top: 0;
            color: #222;
        }

        .descricao {
            color: #666;
            font-size: 14px;
            min-height: 40px;
        }

        .preco {
            font-size: 20px;
            font-weight: bold;
            color: #0a7a2f;
            margin: 15px 0;
        }

        .btn {
            width: 100%;
            background: #222;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #444;
        }

        .vazio {
            background: white;
            padding: 20px;
            border-radius: 10px;
            color: #666;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="topo">
        <h1>Cardápio Digital</h1>
    </div>

    <div class="container">
        <div class="mesa-info">
            <div class="titulo">Informações da Mesa</div>
            <p><strong>ID da Mesa:</strong> <span th:text="${mesa.id}"></span></p>
            <p><strong>Número:</strong> <span th:text="${mesa.numero}"></span></p>
            <p><strong>Nome:</strong> <span th:text="${mesa.nome}"></span></p>
            <p><strong>Área:</strong> <span th:text="${mesa.area}"></span></p>
            <p><strong>Status:</strong> <span th:text="${mesa.status}"></span></p>
        </div>

        <div class="titulo">Itens do Cardápio</div>

        <div th:if="${#lists.isEmpty(itensCardapio)}" class="vazio">
            Nenhum produto disponível para esta empresa.
        </div>

        <div th:if="${!#lists.isEmpty(itensCardapio)}" class="grid-produtos">
            <div class="card-produto" th:each="produto : ${itensCardapio}">
                <h3 th:text="${produto.nome}">Nome do Produto</h3>
                <p class="descricao" th:text="${produto.descricao}">Descrição do produto</p>
                <p><strong>Categoria:</strong> <span th:text="${produto.categoria}"></span></p>
                <p><strong>Setor:</strong> <span th:text="${produto.setorProducao}"></span></p>
                <p><strong>Estoque:</strong> <span th:text="${produto.estoque}"></span></p>
                <div class="preco">
                    R$ <span th:text="${produto.preco}"></span>
                </div>
                <button class="btn" type="button">Adicionar</button>
            </div>
        </div>
    </div>

</body>
</html>
