<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AppVendasBares</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .register-container { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 24px; color: #1a1a2e; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 11px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #0f3460; }
        .form-group small { color: #888; font-size: 12px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; background: #0f3460; color: white; }
        .btn:hover { background: #1a1a2e; }
        .links { text-align: center; margin-top: 16px; }
        .links a { color: #0f3460; text-decoration: none; font-size: 14px; }
        .error-msg { background: #fee; color: #c00; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
        .success-msg { background: #efe; color: #060; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo"><h1>Criar Conta</h1></div>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="regForm" onsubmit="return doRegistrar(event)">
            <div class="form-group">
                <label>Estabelecimento</label>
                <select id="empresaId" required>
                    <option value="">Selecione...</option>
                    <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.nomeFantasia}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="telefone" placeholder="(11) 99999-9999">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required minlength="8">
                <small>Mín. 8 caracteres, 1 maiúscula, 1 caractere especial</small>
            </div>
            <button type="submit" class="btn">Cadastrar</button>
        </form>
        <div class="links"><a href="/login">Já tenho conta</a></div>
    </div>

    <script>
        function doRegistrar(e) {
            e.preventDefault();
            const body = {
                empresaId: parseInt(document.getElementById('empresaId').value),
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                senha: document.getElementById('senha').value
            };

            fetch('/api/auth/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(r => r.json())
            .then(data => {
                if (data.erro) {
                    document.getElementById('errorMsg').textContent = data.erro;
                    document.getElementById('errorMsg').style.display = 'block';
                } else {
                    document.getElementById('successMsg').textContent = 'Cadastro realizado! Faça login.';
                    document.getElementById('successMsg').style.display = 'block';
                    setTimeout(() => window.location.href = '/login', 2000);
                }
            })
            .catch(() => {
                document.getElementById('errorMsg').textContent = 'Erro de conexão';
                document.getElementById('errorMsg').style.display = 'block';
            });
            return false;
        }
    </script>
</body>
</html>
