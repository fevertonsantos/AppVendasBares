<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Seleção de Empresa'">Seleção de Empresa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 32px; color: white; }
        .header h1 { font-size: 28px; margin-bottom: 6px; }
        .header p { color: rgba(255,255,255,0.75); font-size: 15px; }
        .empresa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
        .empresa-card { background: white; border-radius: 14px; padding: 22px; text-decoration: none; color: #1a1a2e; box-shadow: 0 4px 18px rgba(0,0,0,0.2); transition: transform 0.15s ease, box-shadow 0.15s ease; display: flex; flex-direction: column; gap: 8px; }
        .empresa-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .empresa-card .nome { font-size: 18px; font-weight: 700; }
        .empresa-card .razao { font-size: 13px; color: #555; }
        .empresa-card .cnpj { font-size: 12px; color: #888; margin-top: 4px; }
        .empresa-card .status { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; align-self: flex-start; }
        .status-ativa { background: #d4edda; color: #155724; }
        .status-inativa { background: #f8d7da; color: #721c24; }
        .empty { background: white; border-radius: 14px; padding: 40px; text-align: center; color: #888; }
        .empty a { color: #0f3460; text-decoration: none; font-weight: 600; }
        .footer-links { text-align: center; margin-top: 24px; }
        .footer-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; padding: 6px 14px; }
        .footer-links a:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${pageTitle} ?: 'Seleção de Empresa'">Seleção de Empresa</h1>
            <p>Escolha uma empresa para acessar o painel gerencial.</p>
        </div>

        <div class="empresa-grid" th:if="${!#lists.isEmpty(empresas)}">
            <a th:each="emp : ${empresas}"
               th:href="@{'/admin/dashboard/' + ${emp.id}}"
               class="empresa-card">
                <div class="nome" th:text="${emp.nomeFantasia}">Nome Fantasia</div>
                <div class="razao" th:if="${emp.razaoSocial}" th:text="${emp.razaoSocial}">Razão Social</div>
                <div class="cnpj" th:text="${emp.cnpj}">00.000.000/0000-00</div>
                <span class="status"
                      th:classappend="${emp.status} ? 'status-ativa' : 'status-inativa'"
                      th:text="${emp.status} ? 'Ativa' : 'Inativa'">Ativa</span>
            </a>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(empresas)}">
            <p>Nenhuma empresa cadastrada.</p>
            <p style="margin-top:8px;"><a href="/registrar">Cadastrar uma empresa</a></p>
        </div>

        <div class="footer-links">
            <a href="/login">Sair</a>
        </div>
    </div>
</body>
</html>
