<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - AppVendasBares</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-box .logo .icon {
            width: 60px;
            height: 60px;
            background: var(--accent-color);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
        }
        .login-box .logo h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .login-box .logo p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .login-box .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--accent-color);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-box .btn-login:hover {
            background: var(--accent-hover);
        }
        .login-box .links {
            text-align: center;
            margin-top: 16px;
        }
        .login-box .links a {
            color: var(--accent-color);
            font-size: 14px;
            margin: 0 8px;
        }
        .login-box .links a:hover {
            text-decoration: underline;
        }
        .login-error {
            background: rgba(231, 76, 60, 0.15);
            color: var(--red);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <div class="logo">
                <div class="icon">&#127860;</div>
                <h1>AppVendasBares</h1>
                <p>Sistema de Vendas para Bares e Restaurantes</p>
            </div>

            <div class="login-error" id="loginError"></div>

            <form id="loginForm" onsubmit="doLogin(event)">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required/>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha" required/>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="links">
                <a href="#" onclick="recuperarSenha()">Esqueci minha senha</a>
                <a th:href="@{/registrar}">Cadastrar-se</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        function doLogin(e) {
            e.preventDefault();
            var email = document.getElementById('email').value;
            var senha = document.getElementById('senha').value;
            var errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, senha: senha })
            })
            .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
            .then(function(result) {
                if (!result.ok) {
                    errorEl.textContent = result.data.erro || 'Erro ao fazer login';
                    errorEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('usuario', JSON.stringify(result.data));

                // Redirect based on profile
                var perfil = result.data.perfil;
                var empresaId = result.data.empresaId;
                if (perfil === 'MASTER') {
                    window.location.href = '/admin/selecionar-empresa';
                } else if (perfil === 'DONO') {
                    window.location.href = '/admin/dashboard/' + empresaId;
                } else if (perfil === 'PRODUCAO') {
                    window.location.href = '/cozinha/' + empresaId;
                } else if (perfil === 'GARCOM') {
                    window.location.href = '/admin/dashboard/' + empresaId;
                } else {
                    window.location.href = '/cardapio/1';
                }
            })
            .catch(function() {
                errorEl.textContent = 'Erro de conexao com o servidor';
                errorEl.style.display = 'block';
            });
        }

        function recuperarSenha() {
            var email = prompt('Informe seu e-mail para recuperar a senha:');
            if (!email) return;
            fetch('/api/auth/recuperar-senha', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) { alert(data.mensagem || data.erro); })
            .catch(function() { alert('Erro de conexao'); });
        }
    </script>
</body>
</html>
