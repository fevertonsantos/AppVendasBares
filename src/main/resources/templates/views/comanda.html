<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Comanda</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('comanda')}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/header :: header('Comanda')}"></div>

            <div class="content-wrapper">
                <div class="comanda-container">
                    <div class="mesa-header-card">
                        <h1 style="font-size:24px;">Mesa <span th:text="${mesa.numero}">1</span></h1>
                        <p th:text="${mesa.nome}">Mesa 1</p>
                        <span class="badge" th:classappend="${mesa.status.name() == 'OCUPADA'} ? 'badge-ocupada' : 'badge-livre'"
                              th:text="${mesa.status}">LIVRE</span>
                    </div>

                    <div class="btn-row">
                        <a class="btn btn-cardapio" th:href="'/cardapio/' + ${mesa.id}">Abrir Cardapio</a>
                        <button class="btn btn-fechar" th:if="${!#lists.isEmpty(pedidos)}"
                                th:onclick="'fecharComanda(' + ${mesa.id} + ')'">Fechar Comanda</button>
                    </div>

                    <div th:if="${#lists.isEmpty(pedidos)}" class="vazio">
                        Nenhum pedido aberto nesta mesa.
                    </div>

                    <div th:each="pedido : ${pedidos}" class="pedido-section">
                        <div class="pedido-header">
                            <h3>Pedido #<span th:text="${pedido.id}">1</span></h3>
                            <span class="status-badge" th:classappend="'status-' + ${pedido.status}" th:text="${pedido.status}">RECEBIDO</span>
                        </div>
                        <div th:each="item : ${pedido.itens}" class="item-line">
                            <span class="name"><span th:text="${item.quantidade}">1</span>x <span th:text="${item.produtoNome}">Produto</span></span>
                            <span class="price">R$ <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">0.00</span></span>
                        </div>
                        <div class="pedido-total">
                            R$ <span th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}">0.00</span>
                        </div>
                    </div>

                    <div th:if="${!#lists.isEmpty(pedidos)}" class="grand-total-card">
                        <div class="label">Total da Comanda</div>
                        <div class="value">R$ <span id="grandTotal"
                            th:text="${#numbers.formatDecimal(grandTotal, 1, 2)}">0.00</span></div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        function fecharComanda(mesaId) {
            if (!confirm('Deseja realmente fechar a comanda desta mesa?')) return;
            fetch('/api/pedidos/mesa/' + mesaId + '/fechar', { method: 'PUT' })
                .then(function(r) { return r.json(); })
                .then(function() {
                    showToast('Comanda fechada com sucesso!');
                    setTimeout(function() { location.reload(); }, 1500);
                })
                .catch(function() { showToast('Erro ao fechar comanda', true); });
        }
    </script>
</body>
</html>
