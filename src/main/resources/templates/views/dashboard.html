<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard Gerencial</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/header :: header('Dashboard Gerencial')}"></div>

            <div class="content-wrapper">
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-label">Faturamento Diario</div>
                        <div class="kpi-value green">R$ <span th:text="${#numbers.formatDecimal(dashboard.faturamentoDiario, 1, 2)}">0.00</span></div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Faturamento Semanal</div>
                        <div class="kpi-value green">R$ <span th:text="${#numbers.formatDecimal(dashboard.faturamentoSemanal, 1, 2)}">0.00</span></div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Faturamento Mensal</div>
                        <div class="kpi-value green">R$ <span th:text="${#numbers.formatDecimal(dashboard.faturamentoMensal, 1, 2)}">0.00</span></div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Ticket Medio</div>
                        <div class="kpi-value blue">R$ <span th:text="${#numbers.formatDecimal(dashboard.ticketMedio, 1, 2)}">0.00</span></div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Pedidos Hoje</div>
                        <div class="kpi-value" th:text="${dashboard.totalPedidosHoje}">0</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Mesas Ocupadas</div>
                        <div class="kpi-value yellow" th:text="${dashboard.mesasOcupadas}">0</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Mesas Livres</div>
                        <div class="kpi-value green" th:text="${dashboard.mesasLivres}">0</div>
                    </div>
                </div>

                <div class="section">
                    <h2>Produtos Mais Vendidos (Mes)</h2>
                    <table class="data-table" th:if="${!#lists.isEmpty(dashboard.produtosMaisVendidos)}">
                        <thead>
                            <tr><th>#</th><th>Produto</th><th>Qtd Vendida</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="p, stat : ${dashboard.produtosMaisVendidos}">
                                <td><span class="rank" th:text="${stat.index + 1}">1</span></td>
                                <td th:text="${p.nome}">Produto</td>
                                <td th:text="${p.totalVendido}">0</td>
                            </tr>
                        </tbody>
                    </table>
                    <p th:if="${#lists.isEmpty(dashboard.produtosMaisVendidos)}" class="empty-msg">Nenhum dado disponivel.</p>
                </div>
            </div>

            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        setTimeout(function() { location.reload(); }, 60000);
    </script>
</body>
</html>
