version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: appvendas-postgres
    environment:
      POSTGRES_DB: appvendas
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
